services:
  statsbot:
    build: .
    image: discord-stats:latest
    container_name: discord-stats
    restart: unless-stopped
    user: "0:0"   # entrypoint chowns ./data for the app user, then drops privileges
    env_file: .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
